<div class="modal-backdrop" (click)="onClose()"></div>
<div class="modal-window" (click)="$event.stopPropagation()">
  <div class="left-panel">
    <div class="left-content">
      <img src="Assets/icons/Join logo vector.svg" alt="Join Logo" class="panel-logo" />
      <h2 class="panel-title">
        {{ mode === 'edit' ? 'Edit contact' : 'Add contact' }}
      </h2>
      @if (mode === 'add') {
      <p class="panel-subtitle">Tasks are better with a team!</p>
      }
      <div class="panel-underline"></div>
    </div>
  </div>

  <div class="right-panel">
    <button class="modal-close-btn" (click)="onClose()" title="Close">
      <img src="Assets/icons/close-icon.svg" alt="Close" />
    </button>

    <div class="right-content-grid">
      <div class="avatar-container">
        <img src="Assets/icons/profile-placeholder.svg" alt="Avatar Placeholder" class="avatar-img" />
      </div>

      <form class="contact-form" (ngSubmit)="onSave()">
        <div class="inputs-container">
          <div class="input-group">
            <input type="text" placeholder="Name" class="form-input" name="name" [(ngModel)]="name" required />
            <img src="Assets/icons/person-icon.svg" alt="Name Icon" class="input-icon" />
          </div>

          <div class="input-group">
            <input type="email" placeholder="Email" class="form-input" name="email" [(ngModel)]="email" required />
            <img src="Assets/icons/mail-icon.svg" alt="Email Icon" class="input-icon" />
          </div>

          <div class="input-group">
            <input type="tel" placeholder="Phone" class="form-input" name="phone" [(ngModel)]="phone" />
            <img src="Assets/icons/phone-icon.svg" alt="Phone Icon" class="input-icon" />
          </div>
        </div>

        <div class="buttons-container">
          <button type="button" class="btn btn-cancel" (click)="onClose()">
            <span>Cancel</span>
            <img src="Assets/icons/close-icon.svg" alt="Cancel" class="btn-icon" />
          </button>

          <button type="submit" class="btn btn-create">
            <span>{{ mode === 'edit' ? 'Save' : 'Create contact' }}</span>
            <img src="Assets/icons/check-icon.svg" alt="" class="btn-icon" />
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
