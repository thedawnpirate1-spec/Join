<div class="modal-backdrop" (click)="onClose()"></div>
<div class="modal-window" [class.mode-add]="mode === 'add'" (click)="$event.stopPropagation()">
  <div class="left-panel">
    <img src="Assets/icons/Join logo vector.svg" alt="Join Logo" class="panel-logo" />
    <h2 class="panel-title">
      {{ mode === 'edit' ? 'Edit contact' : 'Add contact' }}
    </h2>
    @if (mode === 'add') {
      <p class="panel-subtitle">Tasks are better with a team!</p>
    }
    <div class="panel-underline"></div>
  </div>

  <div class="right-panel">
    <button class="modal-close-btn" (click)="onClose()" title="Close">
      <img src="Assets/icons/close-icon.svg" alt="Close" />
    </button>

    <div class="right-content-grid">
      <div class="avatar-container">
        @if (mode === 'edit' && contact) {
          <div class="avatar-circle" [style.background-color]="avatarColor">
            {{ avatarInitials }}
          </div>
        } @else {
          <img
            src="Assets/icons/profile-placeholder.svg"
            alt="Avatar Placeholder"
            class="avatar-img"
          />
        }
      </div>

      <form class="contact-form" (ngSubmit)="onSave()" novalidate>
        <div class="inputs-container">
          <div class="input-group">
            <input
              type="text"
              placeholder="Name"
              class="form-input"
              [class.form-input-invalid]="nameError"
              name="name"
              [(ngModel)]="name"
              (blur)="validateName()"
              (ngModelChange)="nameError && validateName()"
              required
            />
            <img src="Assets/icons/person-icon.svg" alt="Name Icon" class="input-icon" />
            <span class="input-error">{{ nameError }}</span>
          </div>

          <div class="input-group">
            <input
              type="email"
              placeholder="Email"
              class="form-input"
              [class.form-input-invalid]="emailError"
              name="email"
              [(ngModel)]="email"
              (blur)="validateEmail()"
              (ngModelChange)="emailError && validateEmail()"
              required
            />
            <img src="Assets/icons/mail-icon.svg" alt="Email Icon" class="input-icon" />
            <span class="input-error">{{ emailError }}</span>
          </div>

          <div class="input-group">
            <input
              type="tel"
              placeholder="Phone"
              class="form-input"
              [class.form-input-invalid]="phoneError"
              name="phone"
              [(ngModel)]="phone"
              (blur)="validatePhone()"
              (ngModelChange)="phoneError && validatePhone()"
            />
            <img src="Assets/icons/phone-icon.svg" alt="Phone Icon" class="input-icon" />
            <span class="input-error">{{ phoneError }}</span>
          </div>
        </div>

        <div class="buttons-container">
          <button type="button" class="btn btn-cancel" (click)="onSecondaryAction()">
            <span>{{ mode === 'edit' ? 'Delete' : 'Cancel' }}</span>
            @if (mode === 'add') {
              <img src="Assets/icons/close-icon.svg" alt="" class="btn-icon" />
            }
          </button>

          <button
            type="submit"
            class="btn"
            [class.save-btn]="mode === 'edit'"
            [class.btn-create]="mode !== 'edit'"
          >
            <span>{{ mode === 'edit' ? 'Save' : 'Create contact' }}</span>
            <img src="Assets/icons/check-icon.svg" alt="" class="btn-icon" />
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
