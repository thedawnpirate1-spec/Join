<div class="header-left">
  <img src="Assets/icons/mobile-join-icon.svg" alt="Join" class="mobile-logo" />
  <h1 class="header-title">Kanban Project Management Tool</h1>
</div>
<div class="header-right">
  @if (showHelpButton()) {
    <a routerLink="/help" class="help-link" title="Help">
      <img src="Assets/icons/help-default-icon.svg" alt="Help" class="help-default" />
      <img src="Assets/icons/help-hover-icon.svg" alt="Help" class="help-hover" />
    </a>
  }

  <div class="profile-container">
    <button class="profile-btn" (click)="toggleMenu($event)" title="User Profile">SM</button>

    <div class="dropdown-menu" [class.show]="isMenuOpen">
      <a routerLink="/help" class="dropdown-item help-dropdown-item" (click)="closeMenu()">Help</a>
      <a routerLink="/legal-notice" class="dropdown-item" (click)="closeMenu()">Legal Notice</a>
      <a routerLink="/privacy-policy" class="dropdown-item" (click)="closeMenu()">Privacy Policy</a>
      <a routerLink="/logout" class="dropdown-item" (click)="closeMenu()">Log out</a>
    </div>
  </div>
</div>
