<nav class="sidebar">
  <div class="logo-container">
    <img src="/Assets/icons/Join logo vector.svg" alt="Join Logo" class="logo" />
  </div>

  <div class="menu-container">
    @if (isLoggedIn) {
      <a
        routerLink="/summary"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
      >
        <img src="/Assets/icons/summary-icon.svg" alt="Summary" class="menu-img" />
        <span class="menu-text">Summary</span>
      </a>
      <a routerLink="/add-task" routerLinkActive="active" class="menu-item">
        <img src="/Assets/icons/add-task-icon.svg" alt="Add Task" class="menu-img" />
        <span class="menu-text">Add Task</span>
      </a>
      <a routerLink="/board" routerLinkActive="active" class="menu-item">
        <img src="/Assets/icons/board-icon.svg" alt="Board" class="menu-img" />
        <span class="menu-text">Board</span>
      </a>
      <a routerLink="/contacts" routerLinkActive="active" class="menu-item">
        <img src="/Assets/icons/contact-icon.svg" alt="Contacts" class="menu-img" />
        <span class="menu-text">Contacts</span>
      </a>
    } @else {
      <a routerLink="/login" routerLinkActive="active" class="menu-item">
        <img src="/Assets/icons/login-icon.svg" alt="Log In" class="menu-img" />
        <span class="menu-text">Log In</span>
      </a>
    }
  </div>

  <div class="footer-container">
    <a routerLink="/privacy-policy" class="footer-link"> Privacy Policy </a>

    <a routerLink="/legal-notice" class="footer-link"> Legal Notice </a>
  </div>
</nav>
