<div class="priority-buttons">
  <button
    type="button"
    class="priority-btn urgent"
    [class.selected]="priority === 'urgent'"
    (click)="select('urgent')"
  >
    Urgent
    <svg class="prio-icon" viewBox="0 0 24 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 11 12 5 20 11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M4 16 12 10 20 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <button
    type="button"
    class="priority-btn medium"
    [class.selected]="priority === 'medium'"
    (click)="select('medium')"
  >
    Medium
    <svg class="prio-icon" viewBox="0 0 24 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 8H20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
      <path d="M4 13H20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
    </svg>
  </button>
  <button
    type="button"
    class="priority-btn low"
    [class.selected]="priority === 'low'"
    (click)="select('low')"
  >
    Low
    <svg class="prio-icon" viewBox="0 0 24 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 4 12 10 20 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M4 9 12 15 20 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
</div>
